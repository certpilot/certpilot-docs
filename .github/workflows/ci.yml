name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify every route is documented
        run: npm run check

      # What a reader clicks, read from the built HTML rather than the markdown,
      # because only the build knows how a heading was slugged. VitePress fails
      # on a missing page and is silent on a missing heading; five links into
      # headings that did not exist were live on the published site when this
      # was added. Fails, rather than skipping, if the build produced nothing.
      - name: Prove the link check fails on each kind of dead link
        run: npm run test:checks
      - name: Verify every link and anchor on the built site
        run: npm run check:links
      - name: Verify the vendored route table is current
        run: npm run sync -- --check

      # The prose is vendored on the same terms as the route table, and drifts
      # the same way: somebody improves an explanation in the code repository
      # and this site keeps serving the old one.
      - name: Verify the vendored guides are current
        run: npm run sync:guides -- --check

      # The architecture page is a whole file from the code repository rather
      # than a fragment, and drifts the same way. Worse, it is the page a reader
      # who does not yet know what CertPilot is arrives on, so a stale one is
      # wrong in front of exactly the audience least able to notice.
      - name: Verify the vendored pages are current
        env:
          # This check now also lists the upstream tree, to catch a page that
          # exists there and is published nowhere here. Unauthenticated, that
          # request shares a 60-an-hour budget with every other job on the same
          # runner IP, and the failure arrives looking like the check is broken
          # rather than like a rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:pages -- --check
