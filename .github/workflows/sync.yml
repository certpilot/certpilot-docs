name: Sync routes, guides and pages

# The docs repo vendors routes.json, the guide prose and the architecture page
# so that its build needs no Go toolchain and no checkout of the code.
# The cost of vendoring is drift, so this closes the gap.
#
# Three triggers, and the first one is the important one. A weekly cron alone
# meant a documentation change merged upstream on a Tuesday reached readers the
# following Monday at the earliest — and only then if somebody merged the pull
# request it opened. `repository_dispatch` closes that to minutes: the code
# repository tells this one when docs/ changes. The cron stays as the safety
# net for a dispatch that never arrives, which is a thing that happens when a
# token expires and nothing says so.
on:
  repository_dispatch:
    types: [upstream-docs-changed]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To start deploy.yml after publishing. See "Deploy what was just published".
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Pages first, and on their own, because they are handled differently
      # from the two below.
      - name: Sync whole pages
        env:
          # sync-pages lists the upstream tree to check that every page is
          # either published or deliberately opted out. Unauthenticated that
          # request is rate-limited per runner IP, which fails in a way that
          # looks like the check itself is broken.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The commit that triggered this, when one did.
          #
          # raw.githubusercontent.com is CDN-cached, and a dispatch arrives
          # faster than the cache settles. The first run of this pipeline
          # fetched nine rewritten pages correctly and the tenth from a stale
          # edge, published the mixture, and reported success — a site
          # inconsistent with itself and no failure anywhere. Pinning to the
          # SHA removes the race: that URL's content cannot change.
          CERTPILOT_REF: ${{ github.event.client_payload.sha }}
        run: npm run sync:pages

      - name: Did the pages change
        id: pages
        run: |
          if git diff --quiet -- docs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- docs/
          fi

      # A page arrives here as prose somebody already wrote and already had
      # reviewed, in the repository it was written in. Holding it behind a
      # second review in this one buys nothing and costs the delay this
      # workflow exists to remove — so pages go straight to main, and the
      # deploy is then asked for explicitly below.
      #
      # The build runs first. Pushing to main publishes without CI, since
      # ci.yml only runs on pull requests, and a page that breaks the build
      # would otherwise take the site down until somebody noticed.
      - name: Prove it still builds
        if: steps.pages.outputs.changed == 'true'
        run: npm run build

      - name: Publish the pages
        if: steps.pages.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/
          git commit -m 'Sync the pages from CertPilot'
          git push

      # Asked for, rather than assumed to follow from the push.
      #
      # deploy.yml triggers on push to main, and this workflow used to rely on
      # that. It does not work: GitHub deliberately refuses to start a workflow
      # from a push made with the default GITHUB_TOKEN, so that a workflow
      # cannot trigger itself forever. Nothing reports it — the push succeeds,
      # the job goes green, and no deployment happens.
      #
      # So every page this job published sat on main undeployed until some
      # unrelated push happened to carry it out. The site was stale and nothing
      # said so, which is the exact failure this pipeline was built to remove.
      # Found by publishing a page, watching the sync succeed, and seeing the
      # live site still serving the old copy.
      - name: Deploy what was just published
        if: steps.pages.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      # Routes and guides are different, and get a pull request. A new endpoint
      # usually needs a sentence of prose that a generator cannot write, and
      # opening a pull request is what creates the moment to write it.
      - run: npm run sync
        env:
          CERTPILOT_REF: ${{ github.event.client_payload.sha }}
      - run: npm run sync:guides
        env:
          CERTPILOT_REF: ${{ github.event.client_payload.sha }}

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh routes.json and the guides from CertPilot'
          branch: sync/upstream
          delete-branch: true
          title: 'Refresh the route table and guides from CertPilot'
          body: |
            `routes.json` has drifted from `core/api/router.go`.

            The endpoint pages are generated, so they will pick this up
            automatically. Check whether any new route needs prose — the
            generator carries the router's comments through, but a route with
            no comment arrives here with no explanation.

            Whole pages are not in here: those go straight to `main`, because
            they arrive as prose that was already written and reviewed upstream.
