name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one midway: a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # lastUpdated reads git history; without this every page claims to
          # have been updated at the moment of the build.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds with ignoreDeadLinks off, so a link to an endpoint that no
      # longer exists fails here rather than shipping.
      - run: npm run build

      - name: Verify every route is documented
        run: npm run check

      # Pages must be switched on once, by a person, in
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      #
      # It cannot be done from here. enablement: true asks the API to create
      # the Pages site, but GITHUB_TOKEN is an app installation token and
      # creating a Pages site requires repository-admin rights, which no
      # workflow token can hold — the call comes back "Resource not accessible
      # by integration". The flag is kept because once Pages exists this step
      # finds it and does nothing, and because when it is missing the failure
      # names the real problem instead of the bare "Get Pages site failed"
      # you get without it.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
